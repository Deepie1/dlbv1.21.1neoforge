# ═══════════════════════════════════════════════════════════════════════════
# DEEP LUCKY BLOCK — BANC DE DEMARRAGE REEL (serveur dedie NeoForge)
# ═══════════════════════════════════════════════════════════════════════════
#
# POURQUOI CE FICHIER EXISTE
#   Le 25/11, le mod a crashe au demarrage : une methode utilitaire avait ete
#   inseree entre une annotation @SubscribeEvent et la methode qu'elle annotait.
#   Les seize bancs Python etaient verts. Ils ne pouvaient pas voir l'erreur :
#   aucun d'eux ne compile ni ne lance quoi que ce soit. Un banc vert ne prouve
#   rien en jeu.
#
#   L'agent qui ecrit ce mod n'a ni JDK ni acces aux depots Maven de Mojang et
#   de NeoForge : il lui est MATERIELLEMENT impossible de compiler ou de lancer
#   le jeu. Ce workflow est le seul endroit ou ces deux choses se produisent
#   vraiment. Il remplace « je crois que ca compile » par un fait verifiable.
#
# CE QU'IL FAIT, DANS L'ORDRE
#   1. installe un VRAI JDK 21 Temurin ;
#   2. installe le script de reparation MCreator exactement comme sur le poste
#      du developpeur (dans GRADLE_USER_HOME/init.d), donc teste aussi ce
#      mecanisme ;
#   3. COMPILE les 226 fichiers source — toute erreur de syntaxe, tout symbole
#      absent, toute signature incompatible arrete ici ;
#   4. DEMARRE un serveur dedie NeoForge 21.1.190, c'est-a-dire execute
#      reellement AutomaticEventSubscriber.inject(), l'etape precise qui a
#      crashe le 25/11 ;
#   5. exige la ligne « Done (...s)! » du serveur, et refuse le moindre signe
#      de mod casse.
#
# CE QU'IL NE PROUVE PAS
#   Que le lac se construit correctement, que le terrain est beau, que les
#   chunks sont diffuses. Il prouve que le mod CHARGE et que le serveur TOURNE.
#   C'est le plancher, pas le plafond.
# ═══════════════════════════════════════════════════════════════════════════

name: Demarrage serveur

on:
  push:
    branches:
      - 'arena/54be05b4-dlbv1-21-1neoforge'
    paths-ignore:
      - 'deliverables/**'
      - 'rapports_scan_**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit ou branche a eprouver (vide = HEAD de la branche)"
        required: false
        type: string
      attendu:
        description: "Resultat attendu : demarre (defaut) ou casse (controle negatif)"
        required: false
        default: demarre
        type: choice
        options: [demarre, casse]

permissions:
  contents: read

concurrency:
  group: demarrage-serveur-${{ github.ref }}-${{ inputs.ref || 'head' }}-${{ inputs.attendu || 'demarre' }}
  cancel-in-progress: true

jobs:
  demarrage:
    name: Compiler puis demarrer un serveur dedie
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Annoncer ce qui est eprouve
        run: |
          set -euo pipefail
          echo "commit eprouve : $(git rev-parse HEAD)"
          echo "resultat attendu : ${{ inputs.attendu || 'demarre' }}"
          echo "::notice::commit eprouve $(git rev-parse --short HEAD) — attendu ${{ inputs.attendu || 'demarre' }}"

      - name: Installer le JDK 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Installer le script de reparation MCreator
        # Place exactement ou le developpeur le place : GRADLE_USER_HOME/init.d.
        # Le build echoue donc aussi si CE mecanisme casse.
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle/init.d
          cp src/main/resources/deepluckyblock_patch/tools/deep-lucky-block-patch.gradle \
             ~/.gradle/init.d/deep-lucky-block-patch.gradle
          chmod +x ./gradlew
          echo "Script de reparation installe :"
          ls -l ~/.gradle/init.d/

      - name: Controles statiques (les 18 bancs)
        # Ils ne prouvent rien en jeu, mais ils sont rapides et cadrent le
        # diagnostic : si un banc mord ICI, on sait avant meme de compiler.
        continue-on-error: true
        run: |
          set -uo pipefail
          echecs=0
          for b in importcheck semcheck typecheck skillaliascheck rangedcheck \
                   vfxbuffercheck cosmeticslotcheck structureannouncecheck \
                   meteorstompcheck devscancheck laketaluscheck combosoundcheck \
                   lakefinitioncheck subscribecheck; do
            if ! python3 "src/main/resources/deepluckyblock_patch/tools/$b.py" > "/tmp/$b.out" 2>&1; then
              echecs=$((echecs+1)); echo "::warning::banc $b en echec"; tail -20 "/tmp/$b.out"
            fi
          done
          for b in scanviewcheck mirrorcheck synczipcheck reliefcoutcheck; do
            if ! python3 "tools/$b.py" > "/tmp/$b.out" 2>&1; then
              echecs=$((echecs+1)); echo "::warning::banc $b en echec"; tail -20 "/tmp/$b.out"
            fi
          done
          echo "bancs en echec : $echecs / 18"

      - name: Garde bloquante du profil neige et de sa visionneuse
        # Le lot statique historique ci-dessus reste informatif. Ces deux verrous
        # sont l'acceptance gate de la correction neige : ils doivent faire echouer
        # le job avant compilation si le profil ou son affichage regressent.
        run: |
          set -euo pipefail
          python3 src/main/resources/deepluckyblock_patch/tools/devscancheck.py .
          python3 tools/scanviewcheck.py

      - name: Le script de mise a jour DOIT etre analysable par PowerShell
        # BLOQUANT, contrairement aux autres bancs. Le 26/11 au soir, le dev
        # n'a pas pu mettre son poste a jour du tout : METTRE-A-JOUR.ps1 etait
        # en UTF-8 sans BOM et un tiret cadratin, relu en cp1252 par Windows
        # PowerShell 5.1, refermait une chaine en plein milieu. Un correctif
        # qu'on ne peut pas installer n'est pas un correctif, et le colis le
        # mieux construit ne sert a rien si le script qui le pose ne demarre
        # pas. Ce defaut-la ne doit jamais repartir en livraison.
        run: |
          set -euo pipefail
          python3 tools/ps1asciicheck.py

      - name: COMPILER le mod
        # L'etape qui manquait depuis le debut du projet.
        #
        # Les journaux bruts d'Actions sont inatteignables depuis mon poste
        # (redirection vers un stockage bloque). Quand cette etape a echoue
        # le 26/11, je n'ai eu qu'un « exit code 1 » : impossible de dire si
        # c'etait une erreur de compilation ou un telechargement rate. Une
        # etape qui echoue sans dire pourquoi ne vaut guere mieux qu'une
        # etape absente. La sortie de Gradle est donc capturee et ses lignes
        # utiles sont reemises en annotations, qui, elles, se lisent.
        run: |
          set -uo pipefail
          set +e
          mkdir -p build/ci
          ./gradlew --no-daemon --stacktrace compileJava processResources \
            > build/ci/compilation.log 2>&1
          code=$?
          tail -n 60 build/ci/compilation.log
          if [ "$code" -ne 0 ]; then
            echo "::error::compilation ECHOUEE (code $code)"
            grep -nE "error:|FAILURE:|What went wrong|^\* |Caused by:|Could not (resolve|download|GET)" \
              build/ci/compilation.log | head -n 15 | while IFS= read -r ligne; do
                echo "::error::$ligne"
              done
            exit 1
          fi
          N=$(find build/classes/java/main -name '*.class' 2>/dev/null | wc -l)
          S=$(find src/main/java -name '*.java' | wc -l)
          if [ "$N" -le 0 ]; then
            echo "::error::aucune classe produite malgre un Gradle satisfait"
            exit 1
          fi
          echo "::notice::compilation reussie — $S fichiers source, $N classes produites"

      - name: Empreinte des sources — Gradle et Python doivent concorder
        # Le script de reparation imprime une empreinte des 226 .java a chaque
        # build, pour que le developpeur sache en UNE ligne quelle version
        # tourne chez lui. Encore faut-il que cette empreinte soit juste : elle
        # est calculee deux fois, par deux implementations ecrites separement
        # (Groovy dans le script, Python ici). Si elles divergent, l'empreinte
        # ne vaut rien et ce banc echoue — une mesure a laquelle on ne peut pas
        # se fier est pire que pas de mesure du tout.
        run: |
          set -euo pipefail
          mkdir -p build/ci
          PY=$(python3 tools/empreinte_sources.py | awk '{print $1}')
          ./gradlew --no-daemon applyMcreatorPatch 2>&1 | tee build/ci/patch.log
          GR=$(sed -n 's/.*empreinte des sources Java : \([0-9a-f]\{12\}\).*/\1/p' build/ci/patch.log | head -1)
          echo "Python : $PY"
          echo "Gradle : ${GR:-<aucune>}"
          if [ -z "$GR" ]; then
            echo "::error::le script de reparation n'imprime aucune empreinte"
            exit 1
          fi
          if [ "$PY" != "$GR" ]; then
            echo "::error::empreintes divergentes — Python=$PY Gradle=$GR"
            exit 1
          fi
          echo "::notice::empreinte des sources : $PY — calculee a l'identique par Gradle et par Python"

      - name: Accepter l'EULA et configurer le serveur
        run: |
          set -euo pipefail
          # ModDevGradle place le repertoire de jeu dans run/ ; on couvre aussi
          # les variantes pour qu'un changement de version ne fasse pas echouer
          # le banc sur un detail d'emplacement.
          for d in run runs/server run/server; do
            mkdir -p "$d"
            printf 'eula=true\n' > "$d/eula.txt"
            printf 'online-mode=false\nmax-players=1\nview-distance=4\nsimulation-distance=4\nmotd=banc de demarrage\n' \
              > "$d/server.properties"
          done

      - name: DEMARRER le serveur dedie
        id: serveur
        run: bash tools/ci_boot_server.sh build/ci/serveur.log "${{ inputs.attendu || 'demarre' }}" livre

      # ── CONTROLE NEGATIF ─────────────────────────────────────────────────
      # Un banc qui n'a jamais refuse quoi que ce soit ne protege de rien.
      # On remet ICI, dans le meme job, le fichier exact du commit a977e6c -- celui
      # qui a reellement crashe le jeu le 25/11 -- on recompile, on redemarre,
      # et on EXIGE que le serveur refuse de charger. Si le banc laissait
      # passer, le job echouerait. Rien de casse n'est pousse sur la branche :
      # le fichier est restaure juste apres.
      - name: Controle negatif — reinjecter le defaut du 25/11
        if: ${{ success() && !inputs.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin a977e6c7befab97708e0b384b872859325e190a5
          git checkout FETCH_HEAD -- src/main/java/deepluckyblock/procedures/CrimsonLakeStructureSpawnProcedure.java
          echo "Fichier du lac remplace par la version qui a crashe :"
          git diff --stat HEAD -- src/main/java/deepluckyblock/procedures/CrimsonLakeStructureSpawnProcedure.java

      - name: Controle negatif — la garde DOIT bloquer le build
        # Premiere ligne de defense : le script de reparation refuse le build
        # quand un commentaire s'intercale entre @SubscribeEvent et sa
        # declaration. C'est la forme exacte qui a detourne l'annotation le
        # 25/11 et fait crasher le jeu trois fois. On exige ici que le build
        # soit refuse, ET que ce soit bien la garde qui le refuse.
        if: ${{ success() && !inputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p build/ci
          code=0
          ./gradlew --no-daemon applyMcreatorPatch > build/ci/garde.log 2>&1 || code=$?
          echo "code de sortie Gradle : $code"
          tail -n 30 build/ci/garde.log
          if [ "$code" -eq 0 ]; then
            echo "::error::LA GARDE N'A PAS MORDU : le build passe alors que le defaut du 25/11 est present."
            exit 1
          fi
          if ! grep -q 'Un commentaire est intercale entre une annotation' build/ci/garde.log; then
            echo "::error::build refuse, mais pas par la garde — motif inattendu, voir garde.log"
            exit 1
          fi
          echo "::notice::[garde] build refuse par la garde @SubscribeEvent, comme attendu"

      - name: Controle negatif — recompiler (garde desarmee)
        # Garde desarmee volontairement : on veut que le defaut atteigne le
        # jeu, pour prouver a l'etape suivante qu'il casse encore reellement.
        # Sinon on ne testerait plus que la garde, et plus la panne.
        if: ${{ success() && !inputs.ref }}
        env:
          DLB_PATCH_GUARD: "off"
        run: ./gradlew --no-daemon compileJava

      - name: Controle negatif — le serveur DOIT refuser de demarrer
        if: ${{ success() && !inputs.ref }}
        env:
          DLB_PATCH_GUARD: "off"
        run: bash tools/ci_boot_server.sh build/ci/serveur-controle-negatif.log casse controle-negatif

      - name: Controle negatif — restaurer le fichier
        if: ${{ always() && !inputs.ref }}
        run: |
          set -euo pipefail
          git checkout HEAD -- src/main/java/deepluckyblock/procedures/CrimsonLakeStructureSpawnProcedure.java
          git diff --quiet HEAD -- src/main/java/deepluckyblock/procedures/CrimsonLakeStructureSpawnProcedure.java && echo "Fichier restaure a l'identique."

      - name: Conserver les journaux
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: journaux-serveur
          path: |
            build/ci/compilation.log
            build/ci/serveur.log
            run/logs/**
            run/crash-reports/**
            runs/server/logs/**
            runs/server/crash-reports/**
          if-no-files-found: warn
          retention-days: 14
